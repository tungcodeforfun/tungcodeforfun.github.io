<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG image</title>
<style>
@font-face { font-family: 'Source Serif 4'; src: url('../public/fonts/source-serif.woff2') format('woff2'); font-weight: 400 600 }
* { margin: 0; box-sizing: border-box }
body { width: 1200px; height: 630px; background: #fcfcfa; color: #383733; font-family: 'Source Serif 4', serif; padding: 76px 80px; position: relative }
h1 { font-size: 64px; line-height: 1.1; font-weight: 600; color: #161614 }
.role { font-size: 32px; color: #696862; margin-top: 8px }
.intro { font-size: 28px; line-height: 1.45; max-width: 560px; margin-top: 40px }
svg { position: absolute; right: 40px; bottom: 70px; width: 600px; height: auto }
</style>
</head>
<body>
<h1>Tung Nguyen</h1>
<p class="role">Senior Software Engineer, New York</p>
<p class="intro">Backend Java/Spring Boot services, event-driven systems and AWS infrastructure.</p>
<svg viewBox="0 0 680 300" aria-hidden="true">
  <path d="M360 120 C360 66 210 66 210 128 M204 120 l6 9 l6 -9 M210 172 V232 M76 150 H120 M300 150 H330 M390 150 H430" fill="none" stroke="#cdccc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="24" y="124" width="52" height="52" rx="12" fill="#2453b8" />
  <path d="M38 140 h24 M38 150 h24 M38 160 h16" stroke="#fcfcfa" stroke-width="3.5" stroke-linecap="round" />
  <rect x="120" y="128" width="180" height="44" rx="22" fill="#ecdcd0" stroke="#a24a0d" stroke-width="2" />
  <circle cx="250" cy="150" r="8" fill="#2453b8" stroke="#fcfcfa" stroke-width="2.5" />
  <circle cx="360" cy="150" r="30" fill="#23703a" />
  <path d="M360 132 a18 18 0 0 1 18 18" fill="none" stroke="#fcfcfa" stroke-width="3.5" stroke-linecap="round" />
  <rect x="160" y="232" width="100" height="40" rx="20" fill="#f0dada" stroke="#b22e2e" stroke-width="2" />
  <circle cx="290" cy="252" r="7" fill="#b22e2e" />
  <g id="field"></g>
</svg>
<script>
const g = document.getElementById('field')
for (let c = 0; c < 12; c++) for (let r = 0; r < 10; r++) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
  e.setAttribute('cx', 452 + c * 18); e.setAttribute('cy', 66 + r * 18); e.setAttribute('r', 5)
  e.setAttribute('fill', c < 7 ? '#2453b8' : '#cfcec7')
  g.appendChild(e)
}
</script>
</body>
</html>
