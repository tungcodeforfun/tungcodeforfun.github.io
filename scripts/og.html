<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG image</title>
<style>
@font-face { font-family: 'Mona Sans'; src: url('../public/fonts/mona-sans.woff2') format('woff2'); font-weight: 400 650; font-stretch: 100% 115% }
@font-face { font-family: 'Source Serif 4'; src: url('../public/fonts/source-serif.woff2') format('woff2'); font-weight: 400 600 }
* { margin: 0; box-sizing: border-box }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: #0a0c10 url('../public/stills/hero-dark-wide.webp') 62% 40% / 1500px auto no-repeat; color: #c6c9cf; font-family: 'Source Serif 4', serif }
.scrim { position: absolute; inset: 0; background: linear-gradient(to right, #0a0c10 0, rgb(10 12 16 / .85) 34%, rgb(10 12 16 / 0) 66%), linear-gradient(to top, rgb(10 12 16 / .9) 0, transparent 50%) }
.copy { position: absolute; left: 72px; bottom: 80px; width: 560px; color: #f2f1ed }
h1 { font-family: 'Mona Sans', sans-serif; font-size: 84px; font-weight: 560; line-height: 0.95; letter-spacing: -0.022em }
.role { margin-top: 18px; font-family: 'Mona Sans', sans-serif; font-size: 28px; font-weight: 500 }
.summary { margin-top: 20px; font-size: 25px; line-height: 1.45; color: #c6c9cf }
</style>
</head>
<body>
<div class="scrim"></div>
<div class="copy">
  <h1>Tung Nguyen</h1>
  <p class="role">Senior Software Engineer, New York</p>
  <p class="summary">Four years building backend Java/Spring Boot services, event-driven systems and AWS infrastructure.</p>
</div>
</body>
</html>
