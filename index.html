<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--head-->
    <meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/mona-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-serif.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        const d = document.documentElement
        d.classList.add('js')
        const t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') d.dataset.theme = t
        if (localStorage.getItem('motion') === 'paused') d.dataset.motion = 'paused'
      } catch {}
    </script>
  </head>
  <body>
    <!--app-->
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
