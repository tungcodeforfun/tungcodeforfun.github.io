<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--head-->
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12110e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        var d = document.documentElement
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') d.dataset.theme = t
        if (localStorage.getItem('motion') === 'paused') d.dataset.motion = 'paused'
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--app-->
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
